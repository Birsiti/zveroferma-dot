<!-- v4 · 30.08.2026 · дата/время — нативные карусельные пикеры (type=date/time), цена — число + «руб/кг»,
     пароль убран, текст крупнее/контрастнее, дата в списке «5 сентября — суббота», TG-Studio убран -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Самосбор — управление · Звероферма.BY</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#2d5a27;
    --cream:#F7F3EB;
    --gold:#C9A84C;
    --gold-soft:rgba(201,168,76,0.16);
    --green-light:#7BC67A;
    --card-bg:rgba(255,255,255,0.055);
    --card-border:rgba(255,255,255,0.14);
    --input-bg:rgba(255,255,255,0.08);
    --input-border:rgba(255,255,255,0.20);
    --tg:#2AABEE;
    --tg-dark:#1F93CF;
    --ink:#F7F3EB;
    --ink-soft:rgba(247,243,235,0.86);
    --ink-faint:rgba(247,243,235,0.66);
    --ok:#7BC67A;
    --danger:#E8A36B;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 700px 460px at 78% 4%, rgba(255,255,255,0.06), transparent 60%),
      linear-gradient(178deg,#2d5a27 0%, #1c3d18 62%, #14300f 100%);
    background-attachment:fixed;
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink);
    padding:calc(22px + var(--safe-top)) 16px calc(30px + var(--safe-bottom));
  }
  .wrap{max-width:480px;margin:0 auto;}

  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:800;margin:0 0 4px;color:var(--cream);}
  .subtitle{font-size:13.5px;color:var(--ink-soft);margin:0 0 22px;}

  .card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
    backdrop-filter:blur(6px);
  }
  .card h2{
    font-size:13px;font-weight:700;margin:0 0 14px;color:var(--gold);
    text-transform:uppercase;letter-spacing:.06em;
  }

  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  label{display:block;font-size:12px;font-weight:700;color:var(--ink-faint);margin-bottom:7px;text-transform:uppercase;letter-spacing:.04em;}
  input[type=text], input[type=number], input[type=date], input[type=time]{
    display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;
    padding:13px 13px;min-height:48px;
    border:1.5px solid var(--input-border);border-radius:11px;
    font-size:16px;font-family:inherit;color:var(--cream);
    background:var(--input-bg);outline:none;color-scheme:dark;
  }
  input[type=date], input[type=time]{ -webkit-appearance:none; appearance:none; text-align:left; }
  input[type=date]::-webkit-date-and-time-value,
  input[type=time]::-webkit-date-and-time-value{ text-align:left; margin:0; }
  input[type=date]::-webkit-calendar-picker-indicator,
  input[type=time]::-webkit-calendar-picker-indicator{ margin-left:auto; }
  input:focus{border-color:var(--gold);}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;min-width:0;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--card-border);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-label{font-size:16px;font-weight:700;color:var(--cream);}
  .toggle-hint{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}

  .switch{position:relative;width:48px;height:28px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,0.16);border-radius:28px;transition:.2s;}
  .slider:before{content:"";position:absolute;height:22px;width:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:var(--tg);}
  input:checked + .slider:before{transform:translateX(20px);}

  .stepper{display:flex;align-items:stretch;border:1.5px solid var(--input-border);border-radius:11px;overflow:hidden;background:var(--input-bg);width:100%;min-height:48px;}
  .stepper button{width:46px;flex:none;border:none;background:transparent;font-size:22px;font-weight:500;color:var(--cream);}
  .stepper button:active{background:rgba(255,255,255,0.08);}
  .stepper .val{flex:1;min-width:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--cream);border-left:1.5px solid var(--input-border);border-right:1.5px solid var(--input-border);display:flex;align-items:center;justify-content:center;}

  .save-btn{
    width:100%;padding:15px;
    background:var(--tg);color:#fff;border:none;border-radius:13px;
    font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;margin-top:6px;
  }
  .save-btn:active{background:var(--tg-dark);}
  .save-btn:disabled{opacity:.5;}

  .status-msg{text-align:center;font-size:13px;font-weight:700;padding:10px;border-radius:10px;margin-top:12px;display:none;}
  .status-msg.ok{display:block;background:var(--gold-soft);color:var(--green-light);}
  .status-msg.err{display:block;background:rgba(232,163,107,0.16);color:var(--danger);}

  .loading{text-align:center;color:var(--ink-soft);font-size:13px;padding:40px 0;}

  /* Записавшиеся */
  .reg-summary{margin-bottom:16px;}
  .reg-when{font-size:16px;font-weight:700;color:var(--cream);}
  .reg-nums{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .reg-nums b{color:var(--gold);}
  .reg-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:13px 0;border-bottom:1px solid var(--card-border);
  }
  .reg-item:last-child{border-bottom:none;}
  .reg-main{flex:1;min-width:0;}
  .reg-name{font-size:16px;font-weight:700;color:var(--cream);}
  .reg-name.off{opacity:.5;text-decoration:line-through;}
  .reg-meta{font-size:13px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;margin-top:3px;}
  .reg-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none;margin-top:2px;}
  .reg-badge.came{background:rgba(123,198,122,0.22);color:var(--green-light);}
  .reg-badge.cancelled{background:rgba(232,163,107,0.2);color:var(--danger);}
  .reg-actions{display:flex;gap:7px;margin-top:9px;}
  .reg-btn{
    flex:1;min-height:38px;padding:0 10px;border:1px solid var(--input-border);background:var(--input-bg);
    color:var(--cream);border-radius:9px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;
  }
  .reg-btn:active{background:rgba(255,255,255,0.12);}
  .reg-btn.inline{flex:none;min-height:28px;font-size:12px;}
  .reg-empty{color:var(--ink-faint);font-size:13.5px;text-align:center;padding:14px 0;}
  .reg-sec{margin-top:20px;}
  .reg-sec-h{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;
    margin-bottom:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .reg-toggle{cursor:pointer;}

  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Звероферма.BY</div>
  <h1>🫐 Самосбор — управление</h1>
  <p class="subtitle">Меняешь тут — форма записи обновится сразу после сохранения</p>

  <div id="loadingMsg" class="loading">Загружаем текущие настройки…</div>

  <form id="adminForm" class="hidden">
    <div class="card">
      <h2>Статус</h2>
      <div class="toggle-row">
        <div>
          <div class="toggle-label">Сезон активен</div>
          <div class="toggle-hint">Выключи в конце лета</div>
        </div>
        <label class="switch"><input type="checkbox" id="seasonActive"><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <div>
          <div class="toggle-label">Приём заявок открыт</div>
          <div class="toggle-hint">Идёт запись на заезд ниже</div>
        </div>
        <label class="switch"><input type="checkbox" id="sessionOpen"><span class="slider"></span></label>
      </div>
    </div>

    <div class="card">
      <h2>Параметры заезда</h2>
      <div class="field-row">
        <div class="field">
          <label for="date">Дата заезда</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label for="time">Время</label>
          <input type="time" id="time">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="price">Цена, руб/кг</label>
          <input type="number" id="price" inputmode="decimal" min="0" step="0.5" placeholder="15">
        </div>
        <div class="field">
          <label>Мест на заезд</label>
          <div class="stepper" id="limitStepper">
            <button type="button" data-act="dec" aria-label="Меньше">−</button>
            <div class="val" id="limitVal">10</div>
            <button type="button" data-act="inc" aria-label="Больше">+</button>
          </div>
        </div>
      </div>
    </div>

    <button type="submit" class="save-btn" id="saveBtn">Сохранить</button>
    <div class="status-msg" id="statusMsg"></div>
  </form>

  <div class="card hidden" id="regsCard" style="margin-top:22px;">
    <h2>Кто едет</h2>
    <div class="reg-summary" id="regSummary"></div>
    <div id="regList"></div>
    <div id="waitBlock"></div>
    <div class="status-msg" id="regMsg"></div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg){
  tg.ready(); tg.expand();
  try{ tg.setHeaderColor('#2d5a27'); tg.setBackgroundColor('#14300f'); }catch(e){}
  if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')){ try{ tg.disableVerticalSwipes(); }catch(e){} }
}
function haptic(style){
  if (tg && tg.HapticFeedback){
    if (['success','error','warning'].includes(style)) tg.HapticFeedback.notificationOccurred(style);
    else tg.HapticFeedback.impactOccurred(style || 'light');
  }
}
function confirmAsync(message){
  return new Promise((resolve)=>{
    if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')){
      try{ tg.showConfirm(message, resolve); return; }catch(e){}
    }
    resolve(window.confirm(message));
  });
}

const CONFIG = {
  // Единый бэкенд «Ферма» (area=samosbor). Старый: .../AKfycbwX1NMQRLnIZwut5M3XBH7h9W-59OiyDzbgT3G9ma_uHug7yZa1IkTVajcaPLTRjUYj/exec
  apiUrl: 'https://script.google.com/macros/s/AKfycbzPeY26jMlUlon_DaBEWHWvNZvkH6ID4NUpbakNs6tEuSP0f4qmWLPu96zIbo8h4jRq/exec'
};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function apiGet(qs){
  const res = await fetch(CONFIG.apiUrl + (qs || ''));
  return res.json();
}
async function apiPost(payload){
  const res = await fetch(CONFIG.apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ area: 'samosbor' }, payload))
  });
  return res.json();
}

/* ---- лимит-степпер ---- */
let limitVal = 10;
const limitEl = document.getElementById('limitVal');
document.getElementById('limitStepper').addEventListener('click', (e)=>{
  const b = e.target.closest('button'); if (!b) return;
  limitVal = Math.max(1, Math.min(200, limitVal + (b.dataset.act === 'inc' ? 1 : -1)));
  limitEl.textContent = limitVal;
  haptic('light');
});

/* ---- дата: ISO → «5 сентября — суббота» ---- */
const RU_MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const RU_WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function fmtDate(v){
  if (!v) return '';
  let d;
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) d = new Date(+m[1], +m[2] - 1, +m[3]);
  else { d = new Date(v); if (isNaN(d)) return String(v); }
  return d.getDate() + ' ' + RU_MONTHS[d.getMonth()] + ' — ' + RU_WD[d.getDay()];
}
function fmtPrice(p){ p = String(p || '').trim(); return !p ? '' : (/кг/i.test(p) ? p : p + ' руб/кг'); }
function toIsoInput(v){
  if (/^\d{4}-\d{2}-\d{2}$/.test(v || '')) return v;
  const d = new Date(v); if (isNaN(d)) return '';
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function toHHMM(v){
  const m = String(v || '').match(/(\d{1,2})[:.\s]?(\d{2})?/);
  return m ? (('0' + m[1]).slice(-2) + ':' + (m[2] || '00')) : '';
}

/* ---- загрузка ---- */
async function loadCurrent(){
  try {
    const status = await apiGet();
    document.getElementById('seasonActive').checked = !!status.seasonActive;
    document.getElementById('sessionOpen').checked = !!status.open;
    document.getElementById('date').value = toIsoInput(status.date);
    document.getElementById('time').value = toHHMM(status.time);
    document.getElementById('price').value = String(status.price || '').replace(/[^\d.,]/g, '');
    limitVal = Number(status.limit) || 10;
    limitEl.textContent = limitVal;

    document.getElementById('loadingMsg').classList.add('hidden');
    document.getElementById('adminForm').classList.remove('hidden');
    document.getElementById('regsCard').classList.remove('hidden');
    loadRegs();
  } catch (e) {
    document.getElementById('loadingMsg').textContent = 'Не получилось загрузить настройки — обновите страницу';
  }
}
loadCurrent();

async function loadRegs(){
  try {
    const data = await apiGet('?area=samosbor&action=regs');
    if (!data.ok) return;
    renderRegs(data);
  } catch(e){ /* тихо — список необязателен */ }
}

function regToast(text, ok){
  const m = document.getElementById('regMsg');
  m.textContent = text;
  m.className = 'status-msg ' + (ok === false ? 'err' : 'ok');
  setTimeout(() => { m.className = 'status-msg'; }, 3200);
}

function personRow(r, actionsHtml, off){
  const noTg = !r.telegramId;
  return `<div class="reg-item"><div class="reg-main">
    <div class="reg-name ${off ? 'off' : ''}">${esc(r.name || '—')} · ${r.people} чел.</div>
    <div class="reg-meta">${esc(r.phone || '')}${noTg ? ' · нет Telegram' : ''}${r.invitedAt ? ' · позвали ' + esc(r.invitedAt) : ''}</div>
    ${actionsHtml || ''}
  </div></div>`;
}

function renderRegs(data){
  const sd = data.sessionDate || '';
  const regs = data.regs || [];
  const going   = regs.filter(r => (r.status === 'едет' || r.status === 'приехал') && r.tripDate === sd && sd);
  const waiting = regs.filter(r => r.status === 'приглашён' && r.tripDate === sd);
  const pool    = regs.filter(r => r.status === 'без даты');
  const history = regs.filter(r => r.status === 'отменено' || r.status === 'не едет' ||
    ((r.status === 'приехал' || r.status === 'едет') && r.tripDate !== sd));

  const sdText = fmtDate(sd);
  document.getElementById('regSummary').innerHTML = sd
    ? `<div class="reg-when">${esc(sdText)}</div>
       <div class="reg-nums">Едут <b>${data.confirmed}</b> из ${data.limit}` +
       (data.pending ? ` · ждём ответа <b>${data.pending}</b>` : '') +
       ` · в пуле <b>${pool.length}</b></div>`
    : `<div class="reg-when">Дата заезда не задана</div><div class="reg-nums">В пуле <b>${pool.length}</b></div>`;

  let html = '';

  html += `<div class="reg-sec"><div class="reg-sec-h">Едут (${going.length})</div>`;
  html += going.length ? going.map(r => {
    const came = r.status === 'приехал';
    const badge = came ? ` <span class="reg-badge came">приехал</span>` : '';
    const act = `<div class="reg-actions">
      ${came ? '' : `<button class="reg-btn" data-act="came" data-id="${esc(r.id)}">Приехал</button>`}
      <button class="reg-btn" data-act="pool" data-id="${esc(r.id)}">Убрать</button></div>`;
    return `<div class="reg-item"><div class="reg-main">
      <div class="reg-name">${esc(r.name)} · ${r.people} чел.${badge}</div>
      <div class="reg-meta">${esc(r.phone)}${!r.telegramId ? ' · нет Telegram' : ''}</div>${act}
    </div></div>`;
  }).join('') : `<div class="reg-empty">Пока никто не подтвердил</div>`;
  html += `</div>`;

  if (waiting.length){
    html += `<div class="reg-sec"><div class="reg-sec-h">Ждём ответа (${waiting.length})</div>`;
    html += waiting.map(r => personRow(r,
      `<div class="reg-actions"><button class="reg-btn" data-act="invite" data-id="${esc(r.id)}">Напомнить</button></div>`)).join('');
    html += `</div>`;
  }

  html += `<div class="reg-sec"><div class="reg-sec-h">Не позвали · пул (${pool.length})`;
  if (sd && pool.some(r => r.telegramId)) html += ` <button class="reg-btn inline" id="inviteAllBtn">Позвать всех →</button>`;
  html += `</div>`;
  html += pool.length ? pool.map(r => personRow(r, r.telegramId
    ? `<div class="reg-actions"><button class="reg-btn" data-act="invite" data-id="${esc(r.id)}">Позвать →</button></div>`
    : `<div class="reg-meta" style="margin-top:6px;">позвонить</div>`)).join('') : `<div class="reg-empty">Пул пуст</div>`;
  html += `</div>`;

  if (history.length){
    html += `<div class="reg-sec"><div class="reg-sec-h reg-toggle" id="histToggle">История (${history.length}) ▾</div><div id="histBody" class="hidden">`;
    html += history.map(r => {
      const label = r.status === 'отменено' ? 'отменил' : r.status === 'не едет' ? 'не приедет' : 'приехал ' + esc(r.tripDate || '');
      return `<div class="reg-item"><div class="reg-main">
        <div class="reg-name off">${esc(r.name)} · ${r.people} чел.</div>
        <div class="reg-meta">${esc(r.phone)} · ${label}</div></div></div>`;
    }).join('');
    html += `</div></div>`;
  }

  const list = document.getElementById('regList');
  list.innerHTML = html;
  document.getElementById('waitBlock').innerHTML = '';

  const ht = document.getElementById('histToggle');
  if (ht) ht.addEventListener('click', () => document.getElementById('histBody').classList.toggle('hidden'));

  const iab = document.getElementById('inviteAllBtn');
  if (iab) iab.addEventListener('click', async () => {
    if (!(await confirmAsync('Позвать всех из пула на «' + sd + '»?'))) return;
    iab.disabled = true;
    const ids = pool.filter(r => r.telegramId).map(r => r.id);
    let ok = 0;
    for (const id of ids){ try { const res = await apiPost({ action: 'invite', id }); if (res.ok) ok++; } catch(e){} }
    haptic('success'); regToast(`Позвали ${ok} из ${ids.length}`); loadRegs();
  });

  list.querySelectorAll('.reg-btn[data-act]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const act = btn.dataset.act, id = btn.dataset.id;
      if (act === 'pool' && !(await confirmAsync('Убрать из едущих (вернуть в пул)?'))) return;
      btn.disabled = true;
      try {
        const res = (act === 'invite')
          ? await apiPost({ action: 'invite', id })
          : await apiPost({ action: 'regUpdate', id, status: act === 'came' ? 'приехал' : 'без даты' });
        if (res.ok){
          haptic('success');
          if (act === 'invite') regToast(res.sent ? 'Приглашение отправлено' : (res.message || 'Нет Telegram — позвони'), res.sent);
          loadRegs();
        } else { haptic('error'); btn.disabled = false; regToast(res.message || 'Ошибка', false); }
      } catch(e){ haptic('error'); btn.disabled = false; regToast('Ошибка соединения', false); }
    });
  });
}

/* ---- сохранение настроек ---- */
document.getElementById('adminForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('statusMsg');
  msg.className = 'status-msg';
  btn.disabled = true;
  btn.textContent = 'Сохраняем…';

  const payload = {
    action: 'adminUpdate',
    seasonActive: document.getElementById('seasonActive').checked,
    sessionOpen: document.getElementById('sessionOpen').checked,
    date: document.getElementById('date').value,          // ISO yyyy-mm-dd
    time: document.getElementById('time').value,          // HH:MM
    price: String(document.getElementById('price').value || '').replace(/[^\d.,]/g, ''),
    limit: limitVal
  };

  try {
    const result = await apiPost(payload);
    if (result.success) {
      msg.textContent = '✓ Сохранено — форма записи обновлена';
      msg.className = 'status-msg ok';
      haptic('success');
      loadRegs();
    } else {
      msg.textContent = result.message || 'Не получилось сохранить';
      msg.className = 'status-msg err';
      haptic('error');
    }
  } catch (err) {
    msg.textContent = 'Ошибка соединения — попробуйте ещё раз';
    msg.className = 'status-msg err';
    haptic('error');
  }
  btn.disabled = false;
  btn.textContent = 'Сохранить';
});
</script>
</body>
</html>
