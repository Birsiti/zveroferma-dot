<!-- v6 · 29.08.2026 · вместо SVG-иконок — эмодзи/типографика (− + ✕ 🔧 🔍 🧰);
     нижние чипы-фильтры убраны, фильтр переключается кликом по верхним карточкам
     (на руках / просрочено / возвращено); "на руках" = число наименований, а не штук;
     степперы количества, прогресс частичного возврата, относительные даты,
     скелет-загрузка, мягкое обновление, единый BackButton, reqId + initData -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Учёт инструмента — Любань</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  var scheme = (tg && tg.colorScheme) ? tg.colorScheme
    : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', scheme);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root{
  --radius:16px; --radius-sm:11px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1A1E22; --surface-2:#20252A; --surface-3:#262B31;
  --ink:#EDEFF0; --ink-soft:#8C949C; --ink-faint:#565D64;
  --accent:#2AABEE; --accent-dark:#1B8FCB; --accent-soft:rgba(42,171,238,.14);
  --ok:#38A89D; --ok-soft:rgba(56,168,157,.14);
  --danger:#E5626A; --danger-soft:rgba(229,98,106,.14);
  --line:#2A2F35; --line-strong:#3A414A;
  --shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 8px 20px -12px rgba(0,0,0,.5);
  --skeleton: linear-gradient(90deg, #1E2328 0%, #262C33 50%, #1E2328 100%);
}
:root[data-theme="light"]{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EEF1F4; --surface-3:#E4E8EC;
  --ink:#171A1D; --ink-soft:#5B6570; --ink-faint:#98A1AA;
  --accent:#2AABEE; --accent-dark:#1B8FCB; --accent-soft:rgba(42,171,238,.12);
  --ok:#2E9B8F; --ok-soft:rgba(46,155,143,.12);
  --danger:#D6505A; --danger-soft:rgba(214,80,90,.10);
  --line:#E2E6EA; --line-strong:#CDD3D9;
  --shadow: 0 1px 0 #fff inset, 0 8px 20px -14px rgba(20,25,30,.18);
  --skeleton: linear-gradient(90deg, #E9EDF1 0%, #F3F6F8 50%, #E9EDF1 100%);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',sans-serif; touch-action:manipulation;}
body{padding-top:var(--safe-top);}
svg{display:block; flex:none;}

/* ===== Шапка ===== */
.topbar{ display:flex; align-items:center; gap:12px; padding:14px 16px 6px; }
.topbar .glyph{
  width:38px; height:38px; border-radius:11px; flex:none; font-size:20px; line-height:1;
  background:var(--accent-soft);
  display:flex; align-items:center; justify-content:center;
}
.topbar .tt{ flex:1; min-width:0; }
.topbar h1{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:18px; margin:0; }
.topbar p{ margin:2px 0 0; font-size:12.5px; color:var(--ink-soft); }
.icon-btn{
  width:38px; height:38px; border-radius:50%; flex:none; font-size:16px; line-height:1;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:active{ background:var(--surface-3); }
.icon-btn.spin{ animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.demo-banner{
  margin:6px 16px 12px; padding:8px 12px; border-radius:var(--radius-sm);
  background:var(--accent-soft); color:var(--accent-dark); font-size:12px; font-weight:600;
}

/* ===== Сводка = переключатель фильтра ===== */
.summary{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:10px 16px 14px; }
.sum-card{
  font:inherit; -webkit-appearance:none; appearance:none;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:12px 6px 10px; text-align:center; box-shadow:var(--shadow); cursor:pointer;
  transition:border-color .15s, background .15s;
}
.sum-card:active{ background:var(--surface-2); }
.sum-card .v{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:21px; line-height:1.1; color:var(--ink); }
.sum-card .l{ font-size:10.5px; color:var(--ink-faint); margin-top:4px; letter-spacing:.01em; }
.sum-card.sel{ border-color:var(--accent); background:var(--accent-soft); }
.sum-card.sel .l{ color:var(--accent-dark); }
.sum-card.danger .v{ color:var(--danger); }
.sum-card.danger.sel{ border-color:var(--danger); background:var(--danger-soft); }
.sum-card.danger.sel .l{ color:var(--danger); }

/* ===== Поиск ===== */
.search-wrap{ position:relative; padding:0 16px 12px; }
.search-wrap .si{ position:absolute; left:28px; top:22px; transform:translateY(-50%); font-size:14px; opacity:.6; pointer-events:none; }
.search-wrap input{
  width:100%; min-height:44px; background:var(--surface-2); border:1px solid var(--line);
  border-radius:999px; padding:0 16px 0 40px; color:var(--ink); font-size:15px; font-family:'Inter',sans-serif;
}
.search-wrap input::placeholder{ color:var(--ink-faint); }
.search-wrap input:focus{ outline:none; border-color:var(--accent); }

/* ===== Список ===== */
.list{ padding:0 16px; display:flex; flex-direction:column; gap:10px;
  padding-bottom: max(100px, calc(60px + var(--safe-bottom))); }

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; box-shadow:var(--shadow); cursor:pointer;
}
.card:active{ background:var(--surface-2); }
.card.is-overdue{ border-color:rgba(229,98,106,.4); }
.card-top{ display:flex; align-items:flex-start; gap:10px; }
.avatar{
  width:36px; height:36px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:14px; font-family:'Chakra Petch',sans-serif;
}
.card-main{ flex:1; min-width:0; }
.card-title{ font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
.badge{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; flex:none; }
.badge-active{ background:var(--accent-soft); color:var(--accent-dark); }
.badge-overdue{ background:var(--danger-soft); color:var(--danger); }
.badge-returned{ background:var(--ok-soft); color:var(--ok); }

.card-dates{
  display:flex; flex-direction:column; gap:3px; margin-top:11px;
  font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft);
}
.card-dates b{ color:var(--ink); font-weight:600; }
.card-dates .rel{ color:var(--ink-faint); }
.card-dates .line.warn{ color:var(--danger); }
.card-dates .line.warn b{ color:var(--danger); }

.qty-wrap{ margin-top:11px; }
.qty-bar{ height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden; }
.qty-bar-fill{ height:100%; background:var(--ok); border-radius:999px; transition:width .3s; }
.qty-line{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; font-family:'JetBrains Mono',monospace; }
.qty-line b{ color:var(--ink); }

.card-actions{ margin-top:12px; display:flex; gap:8px; }
.btn-return, .btn-extend{
  min-height:40px; flex:1; border:1px solid var(--line-strong); background:var(--surface-2);
  color:var(--ink); border-radius:var(--radius-sm); font-size:12.5px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.btn-return:active, .btn-extend:active{ background:var(--surface-3); }
.btn-return{ color:var(--ok); }
.btn-return:disabled, .btn-extend:disabled{ opacity:.5; }

/* ===== Пустые состояния / скелет ===== */
.empty{ text-align:center; color:var(--ink-faint); font-size:13px; padding:48px 20px; }
.empty .ic{ margin:0 auto 10px; font-size:30px; line-height:1; }
.empty .retry{
  margin-top:14px; display:inline-block; padding:9px 18px; border-radius:999px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink); font-size:12.5px; font-weight:600;
}
.skeleton-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
.sk{ border-radius:6px; background:var(--surface-3); background-image:var(--skeleton); background-size:200% 100%; animation:sk 1.3s ease-in-out infinite; }
@keyframes sk{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

/* ===== Нижняя панель ===== */
.submit-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  padding:12px 16px calc(12px + var(--safe-bottom));
  background:var(--bg); border-top:1px solid var(--line);
}
.btn-main{
  width:100%; min-height:50px; border:none; border-radius:var(--radius-sm);
  background:var(--accent); color:#fff; font-family:'Chakra Petch',sans-serif;
  font-weight:700; font-size:15px; letter-spacing:.02em;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-main:active{ background:var(--accent-dark); }
.btn-main:disabled{ opacity:.6; }
.btn-main.ghost{ background:var(--surface-2); color:var(--ink); border:1px solid var(--line-strong); }

/* ===== Шторки ===== */
.sheet-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45);
  opacity:0; visibility:hidden; transition:opacity .25s, visibility .25s; z-index:10;
}
.sheet-overlay.open{ opacity:1; visibility:visible; }
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:11;
  background:var(--surface); border-radius:20px 20px 0 0;
  padding:8px 16px calc(16px + var(--safe-bottom));
  transform:translateY(110%); opacity:0; visibility:hidden;
  transition:transform .25s, opacity .25s;
  max-height:90vh; overflow-y:auto;
}
.sheet.open{ transform:translateY(0); opacity:1; visibility:visible; }
.sheet .grip{ width:36px; height:4px; border-radius:999px; background:var(--line-strong); margin:6px auto 12px; }

.sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.sheet-head h2{ font-family:'Chakra Petch',sans-serif; font-size:17px; margin:0; }
.close-btn{
  width:32px; height:32px; border-radius:50%; border:none; background:var(--surface-2);
  color:var(--ink-soft); font-size:15px; line-height:1;
  display:flex; align-items:center; justify-content:center;
}

.field{ margin-bottom:14px; }
.field > label{
  display:block; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
  color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;
}
.field > input{
  width:100%; min-height:46px; background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:0 12px; color:var(--ink); font-size:16px;
  font-family:'Inter',sans-serif;
}
.field > input[type="date"]{ font-family:'JetBrains Mono',monospace; font-size:15px; }
.field > input:focus{ outline:none; border-color:var(--accent); }
.field-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:6px; }
.field-hint.warn{ color:var(--danger); }

/* ===== Степпер количества ===== */
.stepper{
  display:flex; align-items:stretch; background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; max-width:220px;
}
.stepper-btn{
  width:52px; flex:none; border:none; background:transparent; color:var(--ink);
  font-family:'Inter',sans-serif; font-size:24px; font-weight:500; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.stepper-btn:active{ background:var(--surface-3); }
.stepper-btn:disabled{ opacity:.3; }
.stepper input{
  flex:1; min-width:0; width:100%; border:none; background:transparent; text-align:center;
  color:var(--ink); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px;
  border-left:1px solid var(--line); border-right:1px solid var(--line);
}
.stepper input:focus{ outline:none; }
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.stepper input[type=number]{ -moz-appearance:textfield; }

.mini-chips{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.mini-chip{
  min-height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-soft); font-size:12px; font-weight:600;
  display:flex; align-items:center;
}
.mini-chip:active{ background:var(--surface-3); }
.mini-chip.on{ background:var(--accent); border-color:var(--accent); color:#fff; }

.detail-row{
  display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  padding:11px 0; border-bottom:1px solid var(--line); font-size:13.5px;
}
.detail-row:last-of-type{ border-bottom:none; }
.detail-row span{ color:var(--ink-soft); flex:none; }
.detail-row b{ text-align:right; font-weight:600; }

.hidden{ display:none !important; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="glyph">🔧</div>
    <div class="tt">
      <h1>Инструмент</h1>
      <p>Кто взял, что взял, когда вернуть</p>
    </div>
    <button class="icon-btn" id="refreshBtn" aria-label="Обновить">🔄</button>
  </div>

  <div class="demo-banner hidden" id="demoBanner">Демо-режим: бэкенд ещё не подключён, изменения не сохраняются</div>

  <div class="summary" id="summary"></div>

  <div class="search-wrap">
    <span class="si">🔍</span>
    <input type="text" id="search" placeholder="Инструмент или имя..." autocomplete="off">
  </div>

  <div class="list" id="list"></div>

  <div class="submit-bar">
    <button class="btn-main" id="openAddBtn">+&nbsp; Записать выдачу</button>
  </div>
</div>

<!-- ===== Новая выдача ===== -->
<div class="sheet-overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sheet-head">
    <h2>Новая выдача</h2>
    <button class="close-btn" id="closeSheetBtn" aria-label="Закрыть">✕</button>
  </div>

  <div class="field">
    <label>Инструмент</label>
    <input type="text" id="f_item" list="itemSuggestions" placeholder="Например: болгарка" autocomplete="off">
    <datalist id="itemSuggestions"></datalist>
  </div>

  <div class="field">
    <label>Кому</label>
    <input type="text" id="f_who" list="whoSuggestions" placeholder="Имя" autocomplete="off">
    <datalist id="whoSuggestions"></datalist>
  </div>

  <div class="field">
    <label>Количество</label>
    <div class="stepper" id="qtyStepper">
      <button type="button" class="stepper-btn" data-act="dec" aria-label="Меньше">−</button>
      <input type="number" inputmode="numeric" id="f_qty" value="1" min="1" max="999">
      <button type="button" class="stepper-btn" data-act="inc" aria-label="Больше">+</button>
    </div>
  </div>

  <div class="field">
    <label>Дата выдачи</label>
    <input type="date" id="f_issued">
  </div>

  <div class="field">
    <label>Когда напомнить</label>
    <input type="date" id="f_confirm">
    <div class="mini-chips" id="remindChips">
      <button type="button" class="mini-chip" data-m="1">+1 мес</button>
      <button type="button" class="mini-chip" data-m="3">+3 мес</button>
      <button type="button" class="mini-chip" data-m="6">+6 мес</button>
    </div>
    <div class="field-hint">Авто: выдача + 3 мес. Можно поправить вручную.</div>
  </div>

  <div class="field">
    <label>Комментарий</label>
    <input type="text" id="f_comment" placeholder="Необязательно" autocomplete="off">
  </div>

  <button class="btn-main" id="saveBtn">Сохранить</button>
</div>

<!-- ===== Возврат ===== -->
<div class="sheet-overlay" id="returnOverlay"></div>
<div class="sheet" id="returnSheet">
  <div class="grip"></div>
  <div class="sheet-head">
    <h2>Отметить возврат</h2>
    <button class="close-btn" id="closeReturnBtn" aria-label="Закрыть">✕</button>
  </div>
  <div class="field">
    <label>Сколько возвращают</label>
    <div class="stepper" id="returnStepper">
      <button type="button" class="stepper-btn" data-act="dec" aria-label="Меньше">−</button>
      <input type="number" inputmode="numeric" id="f_returnQty" min="1">
      <button type="button" class="stepper-btn" data-act="inc" aria-label="Больше">+</button>
    </div>
    <div class="mini-chips">
      <button type="button" class="mini-chip" id="returnAllBtn">Вернуть всё</button>
    </div>
    <div class="field-hint" id="returnHint"></div>
  </div>
  <button class="btn-main" id="confirmReturnBtn">Подтвердить возврат</button>
</div>

<!-- ===== Детали ===== -->
<div class="sheet-overlay" id="detailOverlay"></div>
<div class="sheet" id="detailSheet">
  <div class="grip"></div>
  <div class="sheet-head">
    <h2>Детали выдачи</h2>
    <button class="close-btn" id="closeDetailBtn" aria-label="Закрыть">✕</button>
  </div>
  <div id="detailBody"></div>
  <button class="btn-main hidden" id="detailConfirmBtn" style="margin-top:14px;">🔔&nbsp; Ещё нужен</button>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;

/* Доступ к кнопке этого Mini App ограничен тегом в LEADTEX —
   отдельная проверка внутри страницы не нужна. */

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzx2d6GZ-ERLAzcd7HpjRofwF5DYE03Bj9fIk_U0kyT4if7b5cF6JJlMB8nJUhalZki/exec";
const BACKEND_READY = !APPS_SCRIPT_URL.includes("ВСТАВЬ");

function haptic(style) {
  if (tg && tg.HapticFeedback) {
    if (["success","error","warning"].includes(style)) tg.HapticFeedback.notificationOccurred(style);
    else tg.HapticFeedback.impactOccurred(style || "light");
  }
}

function applyTelegramTheme(){
  const scheme = (tg && tg.colorScheme) ? tg.colorScheme
    : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', scheme);
  if (tg) {
    const s = getComputedStyle(document.documentElement);
    try { tg.setHeaderColor(s.getPropertyValue("--surface").trim()); tg.setBackgroundColor(s.getPropertyValue("--bg").trim()); } catch(e) {}
  }
}

function confirmAsync(message){
  return new Promise((resolve)=>{
    if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) {
      try { tg.showConfirm(message, resolve); return; } catch(e) {}
    }
    resolve(window.confirm(message));
  });
}

/* ===== Единый стек шторок + одна кнопка BackButton ===== */
const sheetStack = [];
function pushSheet(closeFn){
  sheetStack.push(closeFn);
  if (tg && tg.BackButton) tg.BackButton.show();
}
function popSheet(){
  sheetStack.pop();
  if (tg && tg.BackButton && sheetStack.length === 0) tg.BackButton.hide();
}

function initTelegram() {
  if (!tg) return;
  tg.ready(); tg.expand();
  applyTelegramTheme();
  tg.onEvent && tg.onEvent('themeChanged', applyTelegramTheme);
  if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) { try { tg.disableVerticalSwipes(); } catch(e) {} }
  if (tg.BackButton) tg.BackButton.onClick(()=>{
    const fn = sheetStack[sheetStack.length - 1];
    if (fn) fn();
  });
}

function currentUserName(){
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  return u ? (u.first_name || u.username || "Кто-то из своих") : "Кто-то из своих";
}

/* ===== API =====
   initData — подписанные данные Telegram (бэкенд проверяет их при REQUIRE_AUTH=1).
   reqId    — ключ идемпотентности: повторный тап по «Сохранить» не создаёт дубль. */
const INIT_DATA = (tg && tg.initData) || "";
function uuid(){
  return (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID()
    : "r-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}
async function apiPost(payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ initData: INIT_DATA, by: currentUserName() }, payload))
  });
  return res.json();
}
async function apiList(){
  const url = APPS_SCRIPT_URL + "?action=list"
    + (INIT_DATA ? "&initData=" + encodeURIComponent(INIT_DATA) : "");
  const res = await fetch(url);
  return res.json();
}
async function apiAdd(payload){ return apiPost(Object.assign({ action:"add", reqId: uuid() }, payload)); }
async function apiReturn(id, qty, returned){ return apiPost({ action:"return", id, qty, returned, reqId: uuid() }); }

const AVATAR_COLORS = ["#2AABEE","#B369D6","#E0952E","#38A89D","#E5626A","#C08A4E"];

function daysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function addMonths(dateStr, n){ const d = new Date(dateStr || todayStr()); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(dateStr){
  if (!dateStr) return "—";
  const [y,m,d] = String(dateStr).split("-");
  return d ? `${d}.${m}.${y}` : String(dateStr);
}
function daysBetween(a, b){ return Math.round((new Date(a) - new Date(b)) / 86400000); }
function relDays(dateStr){
  if (!dateStr) return "";
  const diff = daysBetween(dateStr, todayStr());
  const abs = Math.abs(diff);
  let unit;
  if (abs === 0) return "сегодня";
  if (abs < 45) unit = plural(abs, "день","дня","дней");
  else { const mo = Math.round(abs/30); unit = plural(mo, "месяц","месяца","месяцев"); }
  return diff > 0 ? `через ${unit}` : `${unit} назад`;
}
function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  let w = many;
  if (m10 === 1 && m100 !== 11) w = one;
  else if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) w = few;
  return `${n} ${w}`;
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function avatarColor(name){
  const s = String(name || "?");
  let h = 0;
  for (let i=0;i<s.length;i++) h = (h + s.charCodeAt(i)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[h];
}
function initial(name){ return (String(name || "?").trim()[0] || "?").toUpperCase(); }

function normalizeRecord(r){

    returned: r.returned || null,

}

/* ===== Загрузка ===== */
async function loadRecords(opts){
  opts = opts || {};
  if (!BACKEND_READY){ render(); return; }
  if (!opts.soft){ isLoading = true; renderSkeleton(); }
  try {
    const data = await apiList();
    if (data.error){ if (!opts.soft) renderError("Ошибка сервера: " + data.error); return; }
    records = (data.records || []).map(normalizeRecord);
  } catch(err){
    if (!opts.soft) renderError("Нет связи с таблицей. Проверь интернет и попробуй ещё раз.");
    return;
  } finally {
    isLoading = false;
  }
  render();
}

function renderSkeleton(){
  document.getElementById("summary").innerHTML =
    Array(3).fill('<div class="sum-card"><div class="sk" style="height:19px;width:60%;margin:0 auto"></div><div class="sk" style="height:9px;width:80%;margin:6px auto 0"></div></div>').join("");

    '<div class="sk" style="height:11px;width:70%;margin-top:14px"></div><div class="sk" style="height:40px;margin-top:12px;border-radius:11px"></div></div>'
  ).join("");

function renderError(message){
  isLoading = false;
  document.getElementById("summary").innerHTML = "";

    `<div class="empty"><div class="ic">⚠️</div>${escapeHtml(message)}<div><span class="retry" id="retryBtn">Повторить</span></div></div>`;
  const retry = document.getElementById("retryBtn");
  if (retry) retry.addEventListener("click", ()=>loadRecords());
}

function renderSummary(){
  const active = records.filter(r=>!r.returned).length;   // наименований на руках
  const overdue = records.filter(isOverdue).length;
  const returned = records.filter(r=>r.returned).length;
  const cards = [
    { f:"open",     v:active,   l:"на руках" },
    { f:"overdue",  v:overdue,  l:"просрочено", danger:true },
    { f:"returned", v:returned, l:"возвращено" }
  ];
  document.getElementById("summary").innerHTML = cards.map(c=>`
    <button class="sum-card ${c.danger?'danger':''} ${currentFilter===c.f?'sel':''}" data-filter="${c.f}">
      <div class="v">${c.v}</div><div class="l">${c.l}</div>
    </button>`).join("");
  document.querySelectorAll("#summary .sum-card").forEach(el=>{
    el.addEventListener("click", ()=> setFilter(el.dataset.filter));
  });
}

function render(){
  if (isLoading){ renderSkeleton(); return; }

  renderSummary();
  updateSuggestions();

  const list = document.getElementById("list");
  let items = records.slice();

  if (searchQuery){
    const q = searchQuery.toLowerCase();
    items = items.filter(r => r.item.toLowerCase().includes(q) || r.who.toLowerCase().includes(q));
  }
  if (currentFilter === "open")     items = items.filter(r => !r.returned);
  if (currentFilter === "overdue")  items = items.filter(isOverdue);
  if (currentFilter === "returned") items = items.filter(r => r.returned);

  items.sort((a,b)=>{
    const aActive = !a.returned, bActive = !b.returned;
    if (aActive !== bActive) return aActive ? -1 : 1;
    if (aActive) return String(a.confirm).localeCompare(String(b.confirm));
    return String(b.returned).localeCompare(String(a.returned));
  });

  if (items.length === 0){
    const msg = searchQuery ? "Ничего не найдено"
      : currentFilter === "overdue" ? "Просроченного нет — всё под контролем"
      : currentFilter === "returned" ? "Возвращённого пока нет"
      : "Весь инструмент на месте";
    list.innerHTML = `<div class="empty"><div class="ic">🧰</div>${msg}</div>`;
    return;
  }

  list.innerHTML = items.map(r => {
    const qty = r.qty || 1;
    const returnedQty = r.returnedQty || 0;
    const remaining = qty - returnedQty;
    const overdue = isOverdue(r);

    let badge = `<span class="badge badge-active">Активно</span>`;
    if (r.returned) badge = `<span class="badge badge-returned">Возвращено ${fmt(r.returned)}</span>`;
    else if (overdue) badge = `<span class="badge badge-overdue">Просрочено</span>`;

    const remindLine = r.returned ? "" : `
      <div class="line ${overdue?'warn':''}">Напомнить: <b>${fmt(r.confirm)}</b>
        <span class="rel">· ${overdue ? "просрочено на " + plural(Math.abs(daysBetween(todayStr(), r.confirm)), "день","дня","дней") : relDays(r.confirm)}</span>
      </div>`;

    const qtyBlock = (qty > 1) ? `
      <div class="qty-wrap">
        <div class="qty-bar"><div class="qty-bar-fill" style="width:${Math.round(returnedQty/qty*100)}%"></div></div>
        <div class="qty-line">${r.returned ? `Возвращено всё · ${qty} шт` : `Осталось <b>${remaining}</b> из ${qty} шт`}</div>
      </div>` : "";

    return `
      <div class="card ${overdue ? 'is-overdue' : ''}" data-id="${r.id}">
        <div class="card-top">
          <div class="avatar" style="background:${avatarColor(r.who)}">${initial(r.who)}</div>
          <div class="card-main">
            <div class="card-title">${escapeHtml(r.item)}</div>
            <div class="card-sub">Кому: ${escapeHtml(r.who)}${qty > 1 ? ` · ${qty} шт` : ""}</div>
          </div>
          ${badge}
        </div>
        <div class="card-dates">
          <div class="line">Выдано: <b>${fmt(r.issued)}</b> <span class="rel">· ${relDays(r.issued)}</span></div>
          ${remindLine}
        </div>
        ${qtyBlock}
        ${!r.returned ? `
          <div class="card-actions">
            <button class="btn-return" data-id="${r.id}">Отметить возврат</button>
          </div>` : ""}
      </div>
    `;
  }).join("");

  list.querySelectorAll(".btn-return").forEach(btn=>{
    btn.addEventListener("click", (evt)=>{
      evt.stopPropagation();
      const id = Number(btn.dataset.id);
      const rec = records.find(r=>r.id===id);
      if (!rec) return;
      const remaining = remainingOf(rec);
      if (remaining <= 1) handleReturnDirect(id, remaining);
      else openReturnSheet(id, remaining);
    });
  });
}

async function handleReturnDirect(id, qty){
  const ok = await confirmAsync("Отметить инструмент как возвращённый?");
  if (!ok) return;
  await doReturn(id, qty);
}

async function doReturn(id, qty){
  const rec = records.find(r=>r.id===id);
  if (!rec) return;
  qty = Math.max(1, Math.min(qty, remainingOf(rec)));
  const returnedDate = todayStr();

  if (BACKEND_READY){
    try {
      const res = await apiReturn(id, qty, returnedDate);
      if (res.error){ haptic("error"); return; }
    } catch(e){ haptic("error"); return; }
    // локально обновляем сразу, точную картину досинхронизируем в фоне
    applyReturnLocal(rec, qty, returnedDate);
    haptic("success"); render();
    loadRecords({ soft:true });
  } else {
    applyReturnLocal(rec, qty, returnedDate);
    haptic("success"); render();
  }
}
function applyReturnLocal(rec, qty, returnedDate){
  rec.returnedQty = (rec.returnedQty || 0) + qty;
  if (rec.returnedQty >= (rec.qty || 1)) rec.returned = returnedDate;
}

/* ===== Степперы количества ===== */
function bindStepper(wrapId, opts){
  opts = opts || {};
  const wrap = document.getElementById(wrapId);
  const input = wrap.querySelector("input");
  const getMin = ()=> opts.min != null ? opts.min : 1;
  const getMax = ()=> opts.max ? opts.max() : 999;

  function clampValue(){
    let v = parseInt(input.value, 10);
    if (isNaN(v)) v = getMin();
    v = Math.max(getMin(), Math.min(getMax(), v));
    input.value = v;
    refreshButtons();
  }
  function refreshButtons(){
    const v = parseInt(input.value, 10) || getMin();
    wrap.querySelector('[data-act="dec"]').disabled = v <= getMin();
    wrap.querySelector('[data-act="inc"]').disabled = v >= getMax();
  }
  function bump(dir){
    const v = (parseInt(input.value, 10) || getMin()) + dir;
    input.value = Math.max(getMin(), Math.min(getMax(), v));
    refreshButtons();
    haptic("light");
  }

  wrap.querySelectorAll(".stepper-btn").forEach(btn=>{
    const dir = btn.dataset.act === "inc" ? 1 : -1;
    let holdT, repT;
    const start = (e)=>{
      e.preventDefault();
      bump(dir);
      holdT = setTimeout(()=>{ repT = setInterval(()=>bump(dir), 90); }, 420);
    };
    const stop = ()=>{ clearTimeout(holdT); clearInterval(repT); };
    btn.addEventListener("pointerdown", start);
    btn.addEventListener("pointerup", stop);
    btn.addEventListener("pointerleave", stop);
    btn.addEventListener("pointercancel", stop);
  });
  input.addEventListener("change", clampValue);
  input.addEventListener("blur", clampValue);

  return { refresh: refreshButtons, clamp: clampValue, input };
}
